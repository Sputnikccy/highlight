<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Highlight Library</title>
		<link rel="stylesheet" href="sidepanel.css">
	</head>
	<body>
		<header class="library-header">
			<div class="title-row">
				<div>
					<p class="eyebrow">Highlight</p>
					<h1>Library</h1>
				</div>
				<span id="highlight-count" class="count" aria-live="polite"></span>
			</div>
			<div class="library-controls">
				<label class="search-field">
					<span class="visually-hidden">Search highlights</span>
					<span aria-hidden="true">⌕</span>
					<input id="search-input" type="search" placeholder="Search highlights" autocomplete="off">
				</label>
				<div class="control-actions">
					<button id="select-mode" class="filter-button" type="button" aria-pressed="false">Select</button>
					<details id="data-menu" class="export-menu">
						<summary>Data</summary>
						<div class="export-options" aria-label="Library data options">
							<button type="button" data-export-format="markdown">Export Markdown</button>
							<button type="button" data-export-format="json">Export JSON</button>
							<button id="import-json" type="button">Import JSON</button>
						</div>
					</details>
					<input id="import-file" type="file" accept=".json,application/json" hidden>
				</div>
			</div>
			<div class="organization-controls">
				<label class="compact-select">
					<span>View</span>
					<select id="view-filter">
						<option value="all">All highlights</option>
						<option value="starred">Starred</option>
						<option value="notes">With notes</option>
						<option value="untagged">Untagged</option>
					</select>
				</label>
				<label class="compact-select">
					<span>Sort</span>
					<select id="sort-order">
						<option value="newest">Newest first</option>
						<option value="oldest">Oldest first</option>
					</select>
				</label>
			</div>
			<div id="tag-filters" class="tag-filters" hidden>
				<span class="tag-filter-label">Tags</span>
				<div id="tag-filter-options" class="tag-filter-options" aria-label="Filter highlights by tag"></div>
			</div>
			<section id="bulk-toolbar" class="bulk-toolbar" aria-label="Bulk highlight actions" hidden>
				<div class="bulk-toolbar-row">
					<strong id="selection-count" aria-live="polite">0 selected</strong>
					<button id="select-all" type="button">Select all results</button>
				</div>
				<div class="bulk-actions">
					<button id="bulk-star" type="button" disabled>★ Star</button>
					<button id="bulk-tag" type="button" disabled>+ Tags</button>
					<button id="bulk-delete" class="danger-button" type="button" disabled>Delete</button>
				</div>
				<form id="bulk-tag-editor" class="bulk-tag-editor" hidden>
					<label>
						<span class="visually-hidden">Tags to add</span>
						<input id="bulk-tag-input" type="text" placeholder="idea, research" autocomplete="off">
					</label>
					<button id="bulk-tag-cancel" type="button">Cancel</button>
					<button class="primary-button" type="submit">Add tags</button>
				</form>
			</section>
			<div id="data-notice" class="data-notice" hidden role="status">
				<span id="data-notice-message"></span>
				<button id="data-notice-dismiss" type="button" aria-label="Dismiss message">×</button>
			</div>
		</header>

		<main>
			<section id="empty-state" class="empty-state" hidden>
				<div class="empty-icon" aria-hidden="true">✦</div>
				<h2 id="empty-title">No highlights yet</h2>
				<p id="empty-description">Select text in a ChatGPT conversation, then choose <strong>Highlight</strong> from the context menu.</p>
			</section>

			<div id="highlight-list" class="highlight-list" aria-label="Saved highlights"></div>
			<div id="load-more-container" class="load-more-container" hidden>
				<span id="load-more-status"></span>
				<button id="load-more" type="button">Show more</button>
			</div>
		</main>

		<p id="status" class="visually-hidden" role="status" aria-live="polite"></p>
		<script src="sidepanel.js"></script>
	</body>
</html>
